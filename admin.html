<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff7fa">
  <title>派mini 管理端</title>
  <link rel="stylesheet" href="./styles.css?v=20260921-v16">
  <style>
    :root{
      --admin-bg:#fff7fa;
      --admin-card:#fff;
      --admin-line:#efd8e1;
      --admin-text:#523e47;
      --admin-muted:#9c818c;
      --admin-pink:#ef73a1;
      --admin-soft:#fff0f5;
      --admin-good:#4f936d;
      --admin-bad:#c65f76;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--admin-bg);color:var(--admin-text);font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    button,input,select{font:inherit}
    .hidden{display:none!important}
    .admin-wrap{width:min(1220px,calc(100% - 28px));margin:22px auto 48px}
    .admin-top{
      display:flex;align-items:center;justify-content:space-between;gap:16px;
      padding:18px 20px;border:1px solid var(--admin-line);border-radius:24px;background:#fff;
      position:sticky;top:10px;z-index:20;box-shadow:0 12px 35px rgba(227,116,156,.08)
    }
    .admin-brand b{display:block;font-size:19px}
    .admin-brand span{display:block;margin-top:3px;font-size:10px;color:var(--admin-muted)}
    .admin-actions{display:flex;gap:8px;flex-wrap:wrap}
    .admin-btn{
      min-height:38px;border:1px solid var(--admin-line);border-radius:12px;padding:0 13px;
      background:#fff;color:var(--admin-text);font-weight:800;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;cursor:pointer
    }
    .admin-btn.primary{background:var(--admin-pink);color:#fff;border-color:var(--admin-pink)}
    .admin-btn.soft{background:var(--admin-soft);color:#d35f8b}
    .admin-btn.danger{color:var(--admin-bad)}
    .hero{padding:27px 4px 17px}
    .hero h1{margin:0;font-size:32px}
    .hero p{margin:7px 0 0;color:var(--admin-muted);font-size:12px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0 18px}
    .stat,.admin-card{
      border:1px solid var(--admin-line);border-radius:20px;background:var(--admin-card);padding:17px
    }
    .stat span{display:block;font-size:10px;color:var(--admin-muted)}
    .stat b{display:block;margin-top:6px;font-size:26px;color:#df6b96}
    .tabs{
      display:grid;grid-template-columns:repeat(4,1fr);gap:7px;padding:6px;border:1px solid var(--admin-line);
      border-radius:18px;background:#fff;margin-bottom:14px
    }
    .tab{min-height:42px;border:0;border-radius:13px;background:transparent;color:#8b717b;font-weight:900;cursor:pointer}
    .tab.active{background:#ffe5ef;color:#d65d89}
    .panel{display:none}.panel.active{display:block}
    .toolbar{display:flex;gap:9px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}
    .toolbar input{flex:1;min-width:220px}
    input,select{
      width:100%;min-height:42px;border:1px solid var(--admin-line);border-radius:12px;padding:0 12px;background:#fff;color:var(--admin-text);outline:none
    }
    input:focus,select:focus{border-color:#eb9eba;box-shadow:0 0 0 3px rgba(238,117,161,.08)}
    label{display:block;font-size:10px;font-weight:800;color:#806a73}
    label input,label select{margin-top:5px}
    .form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .list{display:flex;flex-direction:column;gap:9px}
    .user-row,.invite-row,.shop-row,.log-row{
      border:1px solid #f0dce4;border-radius:16px;padding:13px;background:#fffafb;
      display:grid;gap:10px
    }
    .user-row{grid-template-columns:minmax(0,1fr) auto;align-items:center}
    .row-title b{font-size:13px}.row-title p{margin:4px 0 0;color:var(--admin-muted);font-size:10px;line-height:1.55}
    .quick{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
    .quick button{
      min-height:32px;border:1px solid var(--admin-line);border-radius:10px;padding:0 9px;background:#fff;color:#d05e89;font-size:10px;font-weight:900;cursor:pointer
    }
    .status{
      display:inline-flex;align-items:center;min-height:23px;padding:0 8px;border-radius:999px;
      background:#edf8f1;color:var(--admin-good);font-size:9px;font-weight:900
    }
    .status.off{background:#fff0f3;color:var(--admin-bad)}
    .invite-form-actions{display:flex;gap:8px;margin-top:12px}
    .generated{
      margin-top:13px;padding:14px;border-radius:15px;background:#fff0f5;border:1px solid #efcbd9
    }
    .generated code{display:block;margin:7px 0;font-size:16px;font-weight:900;word-break:break-all}
    .invite-row,.shop-row,.log-row{grid-template-columns:minmax(0,1fr) auto;align-items:center}
    .meta{color:var(--admin-muted);font-size:10px;line-height:1.55}
    .empty{padding:30px;text-align:center;color:var(--admin-muted);font-size:11px}
    .gate{
      min-height:100vh;display:grid;place-items:center;padding:20px;background:#fff7fa
    }
    .gate-card{
      width:min(420px,100%);padding:24px;border:1px solid var(--admin-line);border-radius:24px;background:#fff;
      box-shadow:0 18px 50px rgba(226,112,153,.1)
    }
    .gate-card h1{margin:0 0 6px;font-size:24px}.gate-card p{margin:0 0 18px;color:var(--admin-muted);font-size:11px}
    .gate-card label{margin-top:10px}
    .gate-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
    .hint{min-height:18px;margin-top:10px;font-size:10px;color:var(--admin-muted)}
    @media(max-width:860px){
      .stats{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr 1fr}
      .tabs{grid-template-columns:1fr 1fr}.user-row,.invite-row,.shop-row,.log-row{grid-template-columns:1fr}
      .quick{justify-content:flex-start}
    }
    @media(max-width:560px){
      .admin-wrap{width:min(100% - 18px,1220px);margin-top:10px}
      .admin-top{position:static;padding:14px;align-items:flex-start;flex-direction:column}
      .stats,.form-grid{grid-template-columns:1fr 1fr}
      .hero h1{font-size:26px}
      .admin-actions{width:100%}.admin-actions>*{flex:1}
    }
  </style>
</head>
<body>
  <section id="loginGate" class="gate hidden">
    <div class="gate-card">
      <h1>派mini 管理端 ♡</h1>
      <p>Owner 登录后进入管理后台。</p>
      <label>邮箱<input id="adminEmail" type="email" autocomplete="email"></label>
      <label>密码<input id="adminPassword" type="password" autocomplete="current-password"></label>
      <div class="gate-actions">
        <button id="adminLoginBtn" class="admin-btn primary" type="button">登录</button>
        <a class="admin-btn" href="./index.html">返回工作台</a>
      </div>
      <div id="loginHint" class="hint"></div>
    </div>
  </section>

  <section id="deniedGate" class="gate hidden">
    <div class="gate-card">
      <h1>这里是管理端</h1>
      <p>当前账号没有管理权限，普通用户仍然正常使用工作台。</p>
      <div class="gate-actions">
        <a class="admin-btn primary" href="./index.html">返回工作台</a>
        <button id="deniedLogoutBtn" class="admin-btn danger" type="button">退出账号</button>
      </div>
    </div>
  </section>

  <main id="adminApp" class="admin-wrap hidden">
    <header class="admin-top">
      <div class="admin-brand">
        <b>派mini 管理端 ♡</b>
        <span id="adminAccount"></span>
      </div>
      <div class="admin-actions">
        <a class="admin-btn soft" href="./index.html">工作台</a>
        <button id="refreshAdminBtn" class="admin-btn" type="button">刷新</button>
        <button id="adminLogoutBtn" class="admin-btn danger" type="button">退出</button>
      </div>
    </header>

    <section class="hero">
      <h1>管理中心</h1>
      <p>用户期限、系统邀请码，以及全站店铺 / 成员 / 价格表都在这里。普通账号看不到这些全局数据。</p>
    </section>

    <section class="stats">
      <div class="stat"><span>账号总数</span><b id="statUsers">0</b></div>
      <div class="stat"><span>有效账号</span><b id="statActive">0</b></div>
      <div class="stat"><span>已到期</span><b id="statExpired">0</b></div>
      <div class="stat"><span>店铺总数</span><b id="statShops">0</b></div>
    </section>

    <nav class="tabs">
      <button class="tab active" data-panel="users" type="button">用户管理</button>
      <button class="tab" data-panel="invites" type="button">邀请码</button>
      <button class="tab" data-panel="shops" type="button">店铺管理</button>
      <button class="tab" data-panel="logs" type="button">加时记录</button>
    </nav>

    <section id="panel-users" class="panel active">
      <div class="admin-card">
        <div class="toolbar">
          <input id="userSearch" placeholder="搜索邮箱 / 昵称">
          <button id="clearUserSearch" class="admin-btn" type="button">清空</button>
        </div>
        <div id="userList" class="list"></div>
      </div>
    </section>

    <section id="panel-invites" class="panel">
      <div class="admin-card">
        <div class="form-grid">
          <label>用途
            <select id="invitePurpose">
              <option value="signup">注册邀请码</option>
              <option value="renewal">续费邀请码</option>
            </select>
          </label>
          <label>时长
            <select id="inviteDuration">
              <option value="7">7 天</option>
              <option value="30">30 天</option>
              <option value="90">90 天</option>
              <option value="365">365 天</option>
            </select>
          </label>
          <label>使用方式
            <select id="inviteMode">
              <option value="single">单次使用</option>
              <option value="multi">多人通用</option>
            </select>
          </label>
          <label>最多使用次数
            <input id="inviteMaxUses" type="number" min="1" value="10" disabled>
          </label>
          <label>备注
            <input id="inviteLabel" maxlength="50" placeholder="可不填">
          </label>
          <label>邀请码失效时间
            <input id="inviteExpires" type="datetime-local">
          </label>
        </div>
        <div class="invite-form-actions">
          <button id="createInviteBtn" class="admin-btn primary" type="button">生成邀请码</button>
        </div>

        <div id="generatedInvite" class="generated hidden">
          <span class="meta">刚刚生成</span>
          <code id="generatedCode"></code>
          <button id="copyInviteBtn" class="admin-btn primary" type="button">复制邀请码</button>
        </div>
      </div>

      <div class="admin-card" style="margin-top:12px">
        <div id="inviteList" class="list"></div>
      </div>
    </section>

    <section id="panel-shops" class="panel">
      <div class="admin-card">
        <div id="shopAdminList" class="list"></div>
      </div>
    </section>

    <section id="panel-logs" class="panel">
      <div class="admin-card">
        <div id="timeLogList" class="list"></div>
      </div>
    </section>
  </main>

  <script type="module" src="./admin.js?v=20260923-v8"></script>
</body>
</html>
