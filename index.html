<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf8f2">
<title>派mini</title>
<style>
html,body{margin:0;min-height:100%;background:#fbf8f2;color:#514945;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.boot{min-height:100vh;display:grid;place-items:center}.mark{font-size:30px;font-weight:900;letter-spacing:-1px}.mark span{color:#e58aa7}.err{max-width:520px;margin:24px;padding:20px;border:1px solid #eee6dc;border-radius:20px;background:#fff;line-height:1.7}.err b{display:block;margin-bottom:8px}.err button{margin-top:12px;border:0;border-radius:12px;padding:10px 14px;background:#e58aa7;color:#fff;font-weight:800}
</style>
</head>
<body>
<div id="loader" class="boot"><div class="mark">派<span>mini</span> ♡</div></div>
<script>
(async()=>{
  const fail=(message)=>{
    document.body.innerHTML='<div class="err"><b>派mini 启动文件加载失败</b><div>'+String(message||'请稍后刷新重试')+'</div><button onclick="location.reload()">重新加载</button></div>';
  };
  try{
    const response=await fetch('./app-shell.html?v=20260923-rescue2',{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    let html=await response.text();

    // html2canvas 只在真正导出图片时需要，不允许它阻塞整个网站启动。
    html=html.replace(/<script\s+src=["']https:\/\/cdn\.jsdelivr\.net\/npm\/html2canvas@1\.4\.1\/dist\/html2canvas\.min\.js["']><\/script>\s*/i,'');

    // 主程序改走本地韧性启动器。启动器负责 Supabase SDK 双 CDN 回退和超时兜底。
    html=html.replace(/<script\s+type=["']module["']\s+src=["']\.\/app-v20260921-8\.js\?v=[^"']+["']><\/script>/i,'<script type="module" src="./app-bootstrap.js?v=20260923-rescue2"><\/script>');

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error('PaiMini shell load failed',error);
    fail(error?.message||error);
  }
})();
</script>
</body>
</html>
