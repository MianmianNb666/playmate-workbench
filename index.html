<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff6fa">
  <title>陪玩工作台</title>
  <link rel="stylesheet" href="./styles.css?v=20260921-1452">
</head>
<body>
  <!-- deploy-version:20260921-1452 -->
  <main class="app-shell">
    <section class="hero-card">
      <div class="hero-top">
        <div>
          <h1 class="brand">陪<span>玩</span>工作台</h1>
          <p class="tagline">和可爱的人一起，创造更多快乐</p>
        </div>
        <button id="accountBtn" class="round-btn" type="button" aria-label="账号">♡</button>
      </div>

      <div class="hero-body">
        <div class="welcome-copy">
          <span class="eyebrow">WELCOME BACK</span>
          <h2>欢迎回来，今天也要轻松一点 ♡</h2>
          <p>先把算单做得顺手又漂亮，其他复杂功能慢慢来。</p>
        </div>

        <div class="hero-decor" aria-hidden="true">
          <span class="heart heart-a">♡</span>
          <span class="heart heart-b">♥</span>
          <span class="heart heart-c">♡</span>
          <div class="soft-block block-a"></div>
          <div class="soft-block block-b"></div>
          <div class="mini-note">今天也会是<br>闪闪发光的一天</div>
        </div>
      </div>
    </section>

    <section class="feature-card">
      <div class="feature-mark" aria-hidden="true">
        <span class="feature-symbol">¥</span>
        <span class="feature-heart">♡</span>
      </div>
      <div class="feature-copy">
        <small>快速算单 · 轻松报价</small>
        <h2>派单计算器</h2>
        <p>选项目、填陪陪、算价格、看累计，再复制报备或导出小票。</p>
        <button id="jumpCalculator" class="pink-arrow" type="button" aria-label="打开派单计算器">›</button>
      </div>
    </section>

    <section class="shortcut-grid" aria-label="功能入口">
      <button class="shortcut-card blush" type="button">
        <span class="shortcut-glyph">¥</span>
        <b>价格表</b>
        <small>管理商品价格</small>
      </button>
      <button class="shortcut-card cream" type="button">
        <span class="shortcut-glyph">≡</span>
        <b>消费记录</b>
        <small>查看历史明细</small>
      </button>
      <button class="shortcut-card mint" type="button">
        <span class="shortcut-glyph">◇</span>
        <b>店铺模板</b>
        <small>管理店铺样式</small>
      </button>
      <button class="shortcut-card blue" type="button">
        <span class="shortcut-glyph">□</span>
        <b>导出小票</b>
        <small>生成报价图片</small>
      </button>
    </section>

    <section class="calculator-panel" id="calculator">
      <div class="section-title">
        <div>
          <span>QUICK CALCULATOR</span>
          <h2>算一单看看 ♡</h2>
        </div>
        <span class="mini-heart">♡</span>
      </div>

      <div class="form-grid">
        <label>
          <span>单价</span>
          <div class="money-input"><b>¥</b><input id="unitPrice" type="number" min="0" step="0.01" placeholder="0.00"></div>
        </label>
        <label>
          <span>数量 / 时长</span>
          <input id="quantity" type="number" min="0" step="0.5" value="1">
        </label>
        <label class="wide">
          <span>额外费用</span>
          <div class="money-input"><b>¥</b><input id="extraFee" type="number" min="0" step="0.01" value="0"></div>
        </label>
      </div>

      <div class="result-card">
        <div>
          <small>本单报价</small>
          <strong id="totalPrice">¥0.00</strong>
        </div>
        <span>单价 × 数量 + 额外费用</span>
      </div>

      <div class="calc-actions">
        <button id="clearCalc" class="soft-btn" type="button">清空</button>
        <button id="copyQuote" class="primary-btn" type="button">复制报价</button>
      </div>
      <p id="copyHint" class="copy-hint"></p>
    </section>

    <section class="bottom-banner">
      <div class="banner-hearts" aria-hidden="true">
        <span>♡</span><span>♥</span><span>♡</span>
      </div>
      <div class="banner-copy">
        <h3>陪伴，让快乐更简单 ♡</h3>
        <p>这一版先专心把派单计算器做好。</p>
      </div>
    </section>

    <nav class="bottom-nav" aria-label="底部导航">
      <button class="nav-item active" type="button">
        <span class="nav-symbol">⌂</span>
        <b>工作台</b>
      </button>
      <button class="nav-item" id="myNavBtn" type="button">
        <span class="nav-symbol">♡</span>
        <b>我的</b>
      </button>
    </nav>
  </main>

  <dialog id="accountDialog" class="account-dialog">
    <form method="dialog" class="dialog-card" onsubmit="return false">
      <button id="closeAccount" class="dialog-close" type="button" aria-label="关闭">×</button>
      <div class="dialog-mark">♡</div>
      <h2>我的账号</h2>
      <p class="dialog-sub">账号底座先保留着，完整陪玩团系统以后再做。</p>

      <div id="loggedOutBox">
        <label class="auth-label">邮箱
          <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
        </label>
        <label class="auth-label">密码
          <input id="password" type="password" autocomplete="current-password" placeholder="至少 6 位">
        </label>
        <div class="auth-actions">
          <button id="signInBtn" class="primary-btn" type="button">登录</button>
          <button id="signUpBtn" class="soft-btn" type="button">注册</button>
        </div>
      </div>

      <div id="loggedInBox" class="hidden">
        <div class="logged-in-pill">
          <span>♡</span>
          <div>
            <small>已登录</small>
            <b id="accountEmail"></b>
          </div>
        </div>
        <button id="signOutBtn" class="soft-btn full" type="button">退出账号</button>
      </div>

      <p id="authHint" class="auth-hint"></p>
      <div id="connectionStatus" class="connection-pill">
        <span class="connection-dot"></span>
        <span id="connectionText">正在连接 Supabase…</span>
      </div>
    </form>
  </dialog>

  <script type="module" src="./app.js?v=20260921-1452"></script>
</body>
</html>
