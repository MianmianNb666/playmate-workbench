    <section class="shortcut-grid" aria-label="功能入口">

      </button>
      <button class="shortcut-card mint" type="button">
        <span class="shortcut-icon">🏪</span>
        <b>店铺模板</b>

      <button class="shortcut-card blue" type="button">

      </button>

    <section class="calculator-panel" id="calculator">
      <div class="section-title">
        <div>
          <span>QUICK CALCULATOR</span>
          <h2>算一单看看 ♡</h2>
        </div>
        <span class="mini-paw">♡</span>
      </div>

      <div class="form-grid">
        <label>
          <span>单价</span>
          <div class="money-input"><b>¥</b><input id="unitPrice" type="number" min="0" step="0.01" placeholder="0.00"></div>
        </label>
        <label>
          <span>数量 / 时长</span>
          <input id="quantity" type="number" min="0" step="0.5" value="1">
        </label>
        <label class="wide">
          <span>额外费用</span>
          <div class="money-input"><b>¥</b><input id="extraFee" type="number" min="0" step="0.01" value="0"></div>
        </label>
      </div>

      <div class="result-card">
        <div>
          <small>本单报价</small>
          <strong id="totalPrice">¥0.00</strong>
        </div>
        <span>单价 × 数量 + 额外费用</span>
      </div>

      <div class="calc-actions">
        <button id="clearCalc" class="soft-btn" type="button">清空</button>
        <button id="copyQuote" class="primary-btn" type="button">复制报价</button>
      </div>
      <p id="copyHint" class="copy-hint"></p>
    </section>

      <div id="loggedOutBox">
        <label class="auth-label">邮箱
          <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
        </label>
        <label class="auth-label">密码
          <input id="password" type="password" autocomplete="current-password" placeholder="至少 6 位">
        </label>
        <div class="auth-actions">
          <button id="signInBtn" class="primary-btn" type="button">登录</button>
          <button id="signUpBtn" class="soft-btn" type="button">注册</button>
        </div>
      </div>

        <div class="logged-in-pill">
          <span>♡</span>
          <div>
            <small>已登录</small>
            <b id="accountEmail"></b>
          </div>
        </div>
        <button id="signOutBtn" class="soft-btn full" type="button">退出账号</button>
      </div>

      <p id="authHint" class="auth-hint"></p>
      <div id="connectionStatus" class="connection-pill">
        <span class="connection-dot"></span>
        <span id="connectionText">正在连接 Supabase…</span>
