<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fbf8f2">
  <title>派mini 恢复</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf8f2;color:#514945;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.box{width:min(430px,calc(100% - 32px));padding:30px;border:1px solid #eee6dc;border-radius:24px;background:#fff;box-shadow:0 16px 38px rgba(192,95,133,.09);text-align:center}.brand{font-size:34px;font-weight:900}.brand span{color:#e58aa7}.msg{margin:14px 0;color:#8f8179;line-height:1.7}.btn{width:100%;height:46px;border:0;border-radius:14px;background:#e58aa7;color:#fff;font-weight:800;cursor:pointer}.small{margin-top:12px;font-size:12px;color:#a2958d}
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">派<span>mini</span> ♡</div>
    <p id="msg" class="msg">正在清理旧缓存和 Service Worker…</p>
    <button id="go" class="btn" type="button" hidden>重新进入派mini</button>
    <div class="small">不会删除你的 Supabase 数据，也不会退出账号。</div>
  </div>
  <script>
    (async()=>{
      const msg=document.getElementById('msg');
      const go=document.getElementById('go');
      try{
        if('serviceWorker' in navigator){
          const regs=await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg=>reg.unregister().catch(()=>false)));
        }
        if('caches' in window){
          const keys=await caches.keys();
          await Promise.all(keys.filter(k=>k.startsWith('paimini-')).map(k=>caches.delete(k)));
        }
        msg.textContent='清理完成 ✓ 现在可以重新进入派mini。';
      }catch(error){
        msg.textContent='清理基本完成，可以重新进入。';
      }
      go.hidden=false;
      go.addEventListener('click',()=>{
        location.replace('./index.html?recovery='+Date.now());
      });
    })();
  </script>
</body>
</html>
