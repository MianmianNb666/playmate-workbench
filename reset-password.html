<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#fff7fa">
  <title>派mini · 重置密码</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#fff7fa;color:#523e47;font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    .card{width:min(430px,100%);padding:24px;border:1px solid #efd8e1;border-radius:24px;background:#fff;box-shadow:0 18px 50px rgba(226,112,153,.1)}
    h1{margin:0 0 8px;font-size:24px}p{color:#9c818c;font-size:12px;line-height:1.6}
    label{display:block;margin-top:12px;font-size:11px;font-weight:800;color:#806a73}
    input{width:100%;min-height:44px;margin-top:6px;border:1px solid #efd8e1;border-radius:12px;padding:0 12px;outline:none}
    button,a{width:100%;min-height:44px;margin-top:12px;border:0;border-radius:12px;font:inherit;font-weight:800;display:flex;align-items:center;justify-content:center;text-decoration:none}
    button{background:#ef73a1;color:#fff;cursor:pointer}.soft{background:#fff0f5;color:#d35f8b}.hidden{display:none!important}.hint{min-height:18px;margin-top:10px;font-size:11px;color:#9c818c}
  </style>
</head>
<body>
  <main class="card">
    <h1>设置新密码 ♡</h1>
    <p>请输入两次新密码。设置完成后即可回到派mini重新登录。</p>
    <div id="formBox">
      <label>新密码<input id="newPassword" type="password" minlength="6" autocomplete="new-password"></label>
      <label>再次输入<input id="confirmPassword" type="password" minlength="6" autocomplete="new-password"></label>
      <button id="savePasswordBtn" type="button">保存新密码</button>
    </div>
    <div id="successBox" class="hidden">
      <p>密码已经更新成功，可以重新登录了。</p>
      <a class="soft" href="./index.html">返回派mini</a>
    </div>
    <div id="hint" class="hint">正在验证重置链接…</div>
  </main>
  <script type="module" src="./reset-password.js?v=20260923-1"></script>
</body>
</html>
