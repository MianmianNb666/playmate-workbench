<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#fbf8f2">
  <title>派mini · 手机缓存修复</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#fbf8f2;color:#514945;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:24px}.card{width:min(430px,100%);background:#fff;border:1px solid #eadbc9;border-radius:24px;padding:26px;box-shadow:0 16px 50px rgba(80,60,50,.08);text-align:center}.brand{font-size:28px;font-weight:800}.brand span{color:#dc7899}.status{margin:18px 0 8px;font-size:15px;font-weight:700}.detail{font-size:13px;line-height:1.7;color:#8b7972}.btn{margin-top:18px;width:100%;border:0;border-radius:14px;padding:13px 16px;background:#e58aa7;color:white;font-size:15px;font-weight:700}.btn:disabled{opacity:.55}.ok{color:#3b7a57}.bad{color:#b94d61}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">派<span>mini</span> ♡</div>
    <div id="status" class="status">正在清理手机旧缓存…</div>
    <div id="detail" class="detail">不会删除账号、店铺、价格表、老板或消费记录，只清理这个浏览器里的旧网页缓存和 Service Worker。</div>
    <button id="go" class="btn" type="button" disabled>正在处理</button>
  </div>
<script>
(async()=>{
  const status=document.getElementById('status');
  const detail=document.getElementById('detail');
  const go=document.getElementById('go');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister().catch(()=>false)));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k).catch(()=>false)));
    }
    status.textContent='旧缓存已清理 ✓';
    status.className='status ok';
    detail.textContent='现在进入最新的派mini。首次重新加载可能会稍慢几秒。';
    go.disabled=false;
    go.textContent='进入派mini';
    const target='./index.html?mobile-clean=20260923-0437';
    go.onclick=()=>location.replace(target);
    setTimeout(()=>location.replace(target),1200);
  }catch(error){
    status.textContent='自动清理没有完全成功';
    status.className='status bad';
    detail.textContent='可以继续进入最新版；如果仍卡住，再从 Safari 打开这个修复页。';
    go.disabled=false;
    go.textContent='继续进入派mini';
    go.onclick=()=>location.replace('./index.html?mobile-clean=20260923-0437');
  }
})();
</script>
</body>
</html>
